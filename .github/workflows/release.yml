name: Build and release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # appimagetool runs as an AppImage; GitHub runners cannot always mount FUSE,
  # so extract-and-run instead of mounting.
  APPIMAGE_EXTRACT_AND_RUN: '1'

jobs:
  desktop:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Checkout RFDTool
        uses: actions/checkout@v4
        with:
          path: RFDTool

      - name: Checkout sqgi (runtime + sqgipkg)
        uses: actions/checkout@v4
        with:
          repository: supercamel/sqgi
          ref: 8d74d83867abb4809ffdbc4956650966f9801ff4
          path: sqgi

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config git file ca-certificates wget \
            meson valac gobject-introspection \
            libglib2.0-dev libgirepository1.0-dev libffi-dev libcairo2-dev libgtk-4-dev \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu qemu-user-static binfmt-support \
            mingw-w64 nsis squashfs-tools xvfb xauth python3 python3-pip libxml2-utils gir1.2-soup-3.0 glib-networking

      - name: Install current CMake for cross-build recipes
        run: |
          python3 -m pip install --user cmake==3.28.4
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build and install sqgi
        run: |
          cmake -S sqgi -B sqgi/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DSQ_ENABLE_JIT=OFF -DSQGI_ENABLE_KERNELS=OFF
          cmake --build sqgi/build
          sudo cmake --install sqgi/build --prefix /usr/local
          sudo ldconfig

      - name: Checkout GSerial enumeration API
        uses: actions/checkout@v4
        with:
          repository: supercamel/gserial
          ref: d9bfcbcd59b43ba9bdbdc055fc928261efdb3562
          path: gserial

      - name: Install GSerial for runtime tests
        run: |
          meson setup gserial/build gserial --prefix=/usr/local
          meson compile -C gserial/build
          meson test -C gserial/build --print-errorlogs
          sudo meson install -C gserial/build
          sudo ldconfig

      - name: Check scripts, serial integration, and phone/tablet layouts
        working-directory: RFDTool
        run: python3 test/run_checks.py

      - name: Build Linux x86_64 AppImage
        working-directory: RFDTool
        run: sqgipkg --target appimage --appimage-arch x86_64

      - name: Build Linux aarch64 AppImage
        working-directory: RFDTool
        run: sqgipkg --target appimage --appimage-arch aarch64

      - name: Build Windows installer
        working-directory: RFDTool
        run: sqgipkg --target win-nsis

      - name: Collect artifacts
        working-directory: RFDTool
        run: |
          mkdir -p artifacts
          cp dist-linux-x86_64/RFDTool.AppImage    artifacts/RFDTool-x86_64.AppImage
          cp dist-linux-aarch64/RFDTool.AppImage   artifacts/RFDTool-aarch64.AppImage
          cp dist-windows-x86_64/RFDTool-Setup.exe artifacts/RFDTool-Setup.exe
          ls -lh artifacts

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rfdtool-desktop
          path: RFDTool/artifacts/*
          if-no-files-found: error

  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64-v8a, x86_64]
    steps:
      - uses: actions/checkout@v4
        with:
          path: RFDTool

      - name: Checkout Android packaging tools
        uses: actions/checkout@v4
        with:
          repository: supercamel/sqgi
          ref: 8d74d83867abb4809ffdbc4956650966f9801ff4
          path: sqgi

      - name: Install Android host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config git curl unzip file \
            meson valac gobject-introspection python3 e2fsprogs libxml2-utils \
            libglib2.0-dev libgirepository1.0-dev libffi-dev libcairo2-dev \
            gir1.2-gtk-4.0 gir1.2-soup-3.0 glib-networking librsvg2-common openjdk-21-jdk

      - name: Build and install Android packaging tools
        run: |
          cmake -S sqgi -B sqgi/build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DSQ_ENABLE_JIT=OFF -DSQGI_ENABLE_KERNELS=OFF
          cmake --build sqgi/build --parallel 4
          sudo cmake --install sqgi/build --prefix /usr/local
          sudo ldconfig

      - name: Set up Android native toolchain
        run: |
          sqgipkg setup --platform android --native-tools --accept-licenses
          sqgipkg setup --platform android --native-tools --check

      - name: Build Android APK
        working-directory: RFDTool
        run: |
          sqgipkg check --platform android --arch ${{ matrix.arch }}
          sqgipkg build --platform android --arch ${{ matrix.arch }} \
            --build-result build-android-result.json
          mkdir -p artifacts
          cp dist-android-${{ matrix.arch }}/com.github.supercamel.rfdtool-${{ matrix.arch }}-debug.apk \
            artifacts/RFDTool-${{ matrix.arch }}.apk

      - name: Build Android regression APKs
        if: matrix.arch == 'x86_64'
        working-directory: RFDTool
        run: |
          sqgipkg build --manifest sqgipkg.android-test.json --platform android --output dist-android-test
          sqgipkg build --manifest sqgipkg.android-layout-test.json --platform android --output dist-android-layout-test

      - name: Prepare emulator
        if: matrix.arch == 'x86_64'
        run: |
          sudo chmod a+rw /dev/kvm
          sqgipkg setup --platform android --emulator --accept-licenses
          sqgipkg emulator --headless --gpu swangle
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Test Android at phone and tablet sizes
        if: matrix.arch == 'x86_64'
        working-directory: RFDTool
        run: python3 test/android_checks.py

      - name: Save Android test evidence
        if: always() && matrix.arch == 'x86_64'
        uses: actions/upload-artifact@v4
        with:
          name: android-test-evidence
          path: RFDTool/build-android-checks/

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: rfdtool-android-${{ matrix.arch }}
          path: RFDTool/artifacts/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [desktop, android]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: rfdtool-*
          path: artifacts
          merge-multiple: true
      - name: Publish all five release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test -s artifacts/RFDTool-x86_64.AppImage
          test -s artifacts/RFDTool-aarch64.AppImage
          test -s artifacts/RFDTool-Setup.exe
          test -s artifacts/RFDTool-arm64-v8a.apk
          test -s artifacts/RFDTool-x86_64.apk
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" artifacts/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" artifacts/* --repo "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
          fi
